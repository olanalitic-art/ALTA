<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALTA · Текстовая клавиатура</title>
<script>const params = new URLSearchParams(location.search); const numeric = params.get("mode") === "numeric"; const layout = params.get("screen") || location.search.slice(1); document.documentElement.classList.toggle("numeric",numeric); if (["tablet", "desktop"].includes(layout)) document.documentElement.classList.add(layout);</script>
<style>
@font-face{font-family:Rubik;src:url(Rubik-Regular.ttf)}
*{box-sizing:border-box}
:root{--ink:#303646;--muted:#626e8e;--line:#e2e4eb;--blue:#4561db;--soft:#f3f4f7}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#e2e4eb;color:var(--ink);font:14px/20px Rubik,Arial,sans-serif}
main{position:relative;isolation:isolate;width:min(390px,100%);height:min(844px,100dvh);overflow:hidden;background:#f7f7f7;display:flex;flex-direction:column}
header{height:56px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
header strong{font-size:20px;letter-spacing:1px;color:#121f7a} header span{border-left:1px solid var(--line);padding-left:14px}
article{padding:24px 16px;flex:1}
h1{margin:0 0 20px;font-size:22px;line-height:28px;font-weight:500}
.source{background:white;border:1px solid var(--line);border-radius:6px;padding:14px}
.source label{display:block;margin-bottom:8px}.source button{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px;background:white;border:1px solid #b3bacb;padding:10px 12px}
#saved{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,input{font:inherit;color:inherit}
button{border:0;border-radius:4px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
dialog{position:absolute;inset:auto 0 0;margin:0;width:100%;max-width:none;max-height:100%;padding:0;border:0;border-radius:8px 8px 0 0;color:var(--ink);background:white;box-shadow:0 -4px 20px #30364626}
main.editing::after{content:"";position:absolute;inset:0;background:#30364626;z-index:1}
dialog[open]{z-index:2}
.editor{padding:14px 14px 12px}
.editor label{display:block;margin-bottom:8px}
input{width:100%;height:48px;padding:0 12px;border:1px solid #5f81ff;border-radius:4px;font-size:18px;outline:0;caret-color:var(--blue)}
input:focus{box-shadow:0 0 0 2px #dfe8ff}
#keys{padding:0 6px 12px;display:grid;gap:4px}
.row{display:flex;justify-content:center;gap:2px}
.key{min-width:0;flex:1 1 0;height:48px;padding:0;background:var(--soft);font-size:18px}
.key.fn{background:#e2e4eb;font-size:14px}.key.space{flex:4}
.key.on{background:#dfe8ff;color:#1e2f93}
.key:active{background:#bfd0ff}
footer{display:flex;justify-content:flex-end;gap:16px;border-top:1px solid var(--line);padding:14px 14px max(14px,env(safe-area-inset-bottom))}
footer button{height:48px;padding:0 16px}
.cancel{background:#ebecef}.apply{background:var(--blue);color:white}
[hidden]{display:none!important}

header{position:relative;z-index:2;flex-shrink:0;gap:8px}
#theme{width:44px;height:44px;background:transparent;color:inherit;font:24px/1 Arial,sans-serif}
#theme:hover,#theme:focus-visible{background:var(--soft)}
:root[data-theme="dark"]{color-scheme:dark;--ink:#f0ecec;--line:#3d414b;--blue:#75a0f4;--soft:#3d414b}
[data-theme="dark"] body{background:#191a1c}
[data-theme="dark"] main{background:#222225}
[data-theme="dark"] :is(header,.source,.source button,dialog,input){background:#26282c}
[data-theme="dark"] header strong{color:#a3c2ff}
[data-theme="dark"] .source button{border-color:#585e6c}
[data-theme="dark"] input{border-color:#75a0f4}
[data-theme="dark"] input:focus{box-shadow:0 0 0 2px #18315e}
[data-theme="dark"] :is(.key.fn,.cancel){background:#585e6c}
[data-theme="dark"] .key.on,[data-theme="dark"] .key:active{background:#1e4898;color:white}
[data-theme="dark"] .apply{color:#15284d}
[data-theme="dark"] main.editing::after{background:#0004}


  html:is(.tablet, .desktop) main { width: min(768px, 100%); height: min(1024px, 100dvh); }
  html:is(.tablet, .desktop) article { padding: 32px; }
  html:is(.tablet, .desktop) dialog { inset: 50% auto auto 50%; transform: translate(-50%, -50%);
    width: 640px; border-radius: 8px; box-shadow: 0 6px 20px #14101c33; }
  html:is(.tablet, .desktop) #keys { padding-inline: 14px; }
  html:is(.tablet, .desktop) .row { gap: 4px; }
  html:is(.tablet, .desktop) .key { max-width: 54px; }
  html:is(.tablet, .desktop) .key.space { max-width: 300px; }
  html:is(.tablet, .desktop) footer { padding-bottom: 14px; }

.back{margin-left:auto;color:var(--blue);padding:10px 0;text-underline-offset:3px}
html.desktop main { width: min(1280px, 100%); height: min(720px, 100dvh); }
@media (hover: hover) { .key:hover { outline: 1px solid var(--blue); outline-offset: -1px; } }
html.numeric #keys {display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(100%,320px);margin:auto;padding:0 14px 12px}
html.numeric #keys .key {max-width:none}
html.numeric:is(.desktop,.tablet) dialog {width:320px}
html.numeric #zero {grid-column:2}
.apply:disabled {background:var(--soft);color:var(--muted);cursor:default}
</style>
<main class="editing">
<header><strong>ALTA</strong><button id="theme" type="button" aria-label="Тёмная тема" aria-pressed="false" title="Тёмная тема">☾</button><span>Веб-визуализация</span><a class="back" href="./" target="_top" aria-label="Все экраны">Экраны</a></header>
<section id="screen" inert><article><h1>Насосная станция</h1><div class="source"><label for="open">Название агрегата</label><button id="open"><span id="saved">Насос подачи</span><span aria-hidden="true">✎</span></button></div></article>
</section>
<dialog open aria-labelledby="label">
<div class="editor"><label id="label" for="draft">Название агрегата</label><input id="draft" inputmode="none" autocomplete="off" spellcheck="false" value="Насос подачи"></div>
<div id="keys" aria-label="Экранная клавиатура"></div>
<footer><button class="cancel">Отмена</button><button class="apply">Применить</button></footer>
</dialog></main>
<script>
const $ = selector => document.querySelector(selector);
const themeButton = $('#theme');
function applyTheme(dark){
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  themeButton.setAttribute('aria-pressed',String(dark));
  themeButton.textContent = dark ? '☀' : '☾';
  themeButton.title = dark ? 'Включить светлую тему' : 'Включить тёмную тему';
}
let dark = false;
try { dark = localStorage.getItem('alta-webvis-keyboard-theme') === 'dark'; } catch {}
applyTheme(dark);
themeButton.onclick = () => {
  dark = !dark;
  applyTheme(dark);
  try { localStorage.setItem('alta-webvis-keyboard-theme',dark ? 'dark' : 'light'); } catch {}
};
const draft = $('#draft'), keys = $('#keys'), panel = $('dialog');
function updateValidity(){
  if(numeric) $('.apply').disabled = !/^[0-9]+$/.test(draft.value);
}
if(numeric){
  document.title = 'ALTA · Цифровая клавиатура';
  $('#label').textContent = $('.source label').textContent = 'Уставка, об/мин';
  $('#saved').textContent = '120';
  draft.addEventListener('beforeinput',event=>{
    if(event.data && /[^0-9]/.test(event.data) && event.cancelable) event.preventDefault();
  });
  draft.addEventListener('input',()=>{
    if(/[^0-9]/.test(draft.value)){
      const cursor = draft.value.slice(0,draft.selectionStart).replace(/[^0-9]/g,'').length;
      draft.value = draft.value.replace(/[^0-9]/g,'');
      draft.setSelectionRange(cursor,cursor);
    }
    updateValidity();
  });
}
const layouts = {
  ru: ['йцукенгшщзхъ','фывапролджэ','ячсмитьбю'],
  en: ['qwertyuiop','asdfghjkl','zxcvbnm'],
  symbols: ['1234567890','@#№%&*()','-+.,:;!?']
};
let language = 'ru', symbols = false, shift = false;
function replaceSelection(value, erase=false){
  let start = draft.selectionStart;
  const end = draft.selectionEnd;
  if(erase && start === end && start > 0){
    const before = Array.from(draft.value.slice(0,start));
    start -= before[before.length-1].length;
  }
  draft.setRangeText(value,start,end,'end');
  updateValidity();
  draft.focus();
}
function draw(){
  keys.replaceChildren();
  function row(){
    const el = document.createElement('div');
    el.className = 'row'; keys.append(el); return el;
  }
  function key(parent,label,action,style='',name=label){
    const el = document.createElement('button');
    el.className = 'key '+style; el.textContent = label;
    el.setAttribute('aria-label',name);
    el.onpointerdown = event => event.preventDefault();
    el.onclick = action; parent.append(el);
    return el;
  }
  if(numeric){
    for(const digit of '1234567890'){
      const button = key(keys,digit,()=>replaceSelection(digit));
      if(digit==='0') button.id='zero';
    }
    key(keys,'⌫',()=>replaceSelection('',true),'fn','Удалить цифру');
    return;
  }
  layouts[symbols?'symbols':language].forEach((letters,index)=>{
    const line = row();
    if(index===2 && !symbols){
      const toggle = key(line,'⇧',()=>{shift=!shift; draw();draft.focus()},shift?'fn on':'fn','Верхний регистр');
      toggle.setAttribute('aria-pressed',String(shift));
    }
    for(const letter of letters){
      const shown = shift && !symbols ? letter.toUpperCase() : letter;
      key(line,shown,()=>{replaceSelection(shown);if(shift){shift=false;draw()}});
    }
    if(index===2) key(line,'⌫',()=>replaceSelection('',true),'fn','Удалить символ');
  });
  const controls = row();
  key(controls,symbols?(language==='ru'?'АБВ':'ABC'):'123',()=>{symbols=!symbols;shift=false;draw();draft.focus()},'fn','Буквы или символы');
  key(controls,language==='ru'?'EN':'РУ',()=>{language=language==='ru'?'en':'ru';symbols=false;shift=false;draw();draft.focus()},'fn','Сменить язык');
  key(controls,'Пробел',()=>replaceSelection(' '),'space');
}
function closeEditor(apply){
  if(apply && numeric && !/^[0-9]+$/.test(draft.value)) return;
  if(apply) $('#saved').textContent=draft.value;
  panel.close(); $('main').classList.remove('editing'); $('#screen').inert=false;$('#open').focus();
}
function edit(){
  draft.value=$('#saved').textContent;
  updateValidity();
  language='ru';symbols=false;shift=false;draw();
  $('#screen').inert=true; $('main').classList.add('editing');
  if(!panel.open) panel.show();
  draft.focus();draft.setSelectionRange(numeric ? 0 : draft.value.length,draft.value.length);
}
$('#open').onclick=edit;
$('.cancel').onclick=()=>closeEditor(false);
$('.apply').onclick=()=>closeEditor(true);
panel.addEventListener('keydown',event=>{
  if(event.key==='Escape'){event.preventDefault();closeEditor(false)}
  if(event.key==='Enter' && event.target===draft && !event.isComposing){event.preventDefault();closeEditor(true)}
});
edit();
</script></html>
